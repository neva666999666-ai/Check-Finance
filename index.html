","Подоходный налог (GPM)":"Income tax (GPM)","Лимит дохода индивидуальной деятельности":"Individual activity income limit","Литва, индивидуальная деятельность: расходы по факту или 30% дохода без чеков. Налог около 5% с первых 20 000 € прибыли, дальше растёт до 20–32%. Взносы Sodra 19,5% с 90% прибыли.":"Lithuania, individual activity: actual expenses or 30% of income without receipts. About 5% tax on the first €20,000 of profit, rising to 20–32% above that. Sodra contributions of 19.5% on 90% of profit.","До 15-го числа":"By the 15th","Взносы Sodra за прошлый месяц":"Sodra contributions for the previous month","До 1 мая":"By May 1","До 25-го числа":"By the 25th","Декларация по НДС, если вы плательщик":"VAT return, if you are registered","Ставка 7% действует для малых компаний с доходом до 300 000 €, в первые два года возможно 0%.":"The 7% rate applies to small companies with income up to €300,000; 0% may apply in the first two years.","До 15-го каждого месяца":"By the 15th of each month","Взносы Sodra и налог с зарплат":"Sodra contributions and payroll tax","До 25-го":"By the 25th","Декларация НДС за прошлый месяц":"VAT return for the previous month","До 15 июня":"By June 15,","Налог на прибыль и годовая отчётность за":"Corporate income tax and annual reporting for","Польша":"Poland","здоровье":"health","Налог ryczałt":"Ryczałt tax","Ставка ryczałt, %":"Ryczałt rate, %","Зависит от вида деятельности: например 12% для IT, 8,5% для многих услуг, 17% для свободных профессий.":"Depends on the type of activity: for example 12% for IT, 8.5% for many services, 17% for liberal professions.","Польша, ryczałt: налог с дохода без вычета расходов (ставка зависит от вида деятельности), социальные взносы ZUS и фиксированный взнос на здоровье по ступеням дохода.":"Poland, ryczałt: tax on revenue with no expense deduction (the rate depends on the type of activity), ZUS social contributions and a fixed health contribution by income band.","Линейный 19%":"Flat 19%","здоровье 4,9%":"health 4.9%","Налог 19%":"Tax 19%","Польша, линейный налог 19% с прибыли. Взнос на здоровье 4,9% дохода, не меньше минимума, плюс ZUS.":"Poland, 19% flat tax on profit. Health contribution of 4.9% of income, not less than the minimum, plus ZUS.","Шкала 12/32%":"Scale 12/32%","здоровье 9%":"health 9%","Налог по шкале":"Scale tax","Польша, налоговая шкала: 12% до 120 000 zł дохода в год и 32% выше, с необлагаемой суммой 30 000 zł. Взнос на здоровье 9%, плюс ZUS.":"Poland, tax scale: 12% up to 120,000 zł of income per year and 32% above, with a tax-free amount of 30,000 zł. Health contribution of 9%, plus ZUS.","До 10-го числа":"By the 10th","Взносы ZUS":"ZUS contributions","Авансы по налогу на доход":"Income tax advances","если вы плательщик НДС":"if you are VAT-registered","Годовая декларация PIT за прошлый год":"Annual PIT return for last year","Ставка 9% для малых налогоплательщиков (выручка до ≈2 млн €), иначе 19%. Есть эстонская модель налога с распределённой прибыли.":"9% rate for small taxpayers (revenue up to ≈€2 million), otherwise 19%. An Estonian-style tax on distributed profit is also available.","Взносы ZUS за сотрудников":"ZUS contributions for employees","Налог с зарплат (PIT-4R) и авансы":"Payroll tax (PIT-4R) and advances","за прошлый месяц":"for the previous month","До 31 марта":"By March 31,","Годовая декларация CIT-8 за":"Annual CIT-8 return for","Германия":"Germany","Страхование (оценка)":"Insurance (estimate)","Подоходный налог":"Income tax","Страхование, % от прибыли":"Insurance, % of profit","Медицинская и пенсионная страховка зависят от вашего статуса. Укажите свою долю от прибыли.":"Health and pension insurance depend on your status. Enter your share of profit.","Германия, фрилансер или Gewerbe: подоходный налог по прогрессивной шкале 14–45% (необлагаемый минимум 12 348 €) с прибыли после страховки. Торговый налог Gewerbesteuer не включён.":"Germany, freelancer or Gewerbe: income tax on a progressive scale of 14–45% (tax-free minimum €12,348) on profit after insurance. Trade tax (Gewerbesteuer) is not included.","оборот до 25 000 € за прошлый год и до 100 000 € в текущем":"turnover up to €25,000 last year and up to €100,000 this year","Предварительная декларация по НДС (Umsatzsteuer-Voranmeldung)":"Advance VAT return (Umsatzsteuer-Voranmeldung)","марта, июня, сентября, декабря":"March, June, September, December","Авансы по подоходному налогу":"Income tax advances","До 31 июля":"By July 31","Годовая декларация за прошлый год":"Annual return for last year","Ставка включает корпоративный налог 15% с надбавкой солидарности и торговый налог около 14% (зависит от коммуны). Дивиденды: 25% + надбавка.":"The rate includes 15% corporate tax with the solidarity surcharge and about 14% trade tax (depends on the municipality). Dividends: 25% + surcharge.","Налог с зарплат, НДС и взносы":"Payroll tax, VAT and contributions","Авансы по корпоративному налогу":"Corporate tax advances","После окончания года":"After the year ends","Годовая отчётность и декларации за":"Annual reports and returns for","Украина":"Ukraine","ДПС":"State Tax Service","группа, 5%":"group, 5%","ЄСВ":"ESV","Единый налог 5% + военный сбор 1%":"Single tax 5% + military levy 1%","Лимит дохода 3-й группы":"Group 3 income limit","Украина, ФОП 3 группы без НДС: единый налог 5% с дохода, военный сбор 1% и фиксированный ЄСВ 1 902,34 грн в месяц.":"Ukraine, FOP group 3 without VAT: 5% single tax on income, 1% military levy and a fixed ESV of UAH 1,902.34 per month.","группа, 3% (НДС)":"group, 3% (VAT)","Единый налог 3% + военный сбор 1%":"Single tax 3% + military levy 1%","Украина, ФОП 3 группы плательщик НДС: единый налог 3% с дохода плюс НДС отдельно, военный сбор 1%, ЄСВ 1 902,34 грн в месяц.":"Ukraine, FOP group 3 VAT payer: 3% single tax on income plus VAT separately, 1% military levy, ESV of UAH 1,902.34 per month.","Квартал + 40 дней":"Quarter end + 40 days","Декларация единого налога (3-я группа)":"Single tax return (group 3)","Ещё 10 дней":"Another 10 days","Оплата единого налога и военного сбора":"Payment of single tax and military levy","До 20-го числа после квартала":"By the 20th after the quarter","Оплата ЄСВ за квартал":"ESV payment for the quarter","Для ТОВ на упрощённой системе вместо налога на прибыль единый налог 5% с дохода. Дивиденды: 5% налога и 5% военного сбора.":"For an LLC on the simplified system, a 5% single tax on income replaces corporate tax. Dividends: 5% tax and 5% military levy.","Ежеквартально":"Quarterly","Отчёт по ЄСВ и налогам с зарплат":"ESV and payroll tax report","До 1 марта":"By March 1,","Годовая декларация по налогу на прибыль за":"Annual corporate income tax return for","Казахстан":"Kazakhstan","КГД":"State Revenue Committee","ИП упрощёнка":"Simplified sole proprietor","ОПВ, СО, ВОСМС":"OPV, SO, VOSMS","Налог 4% с дохода":"Tax 4% of income","Казахстан, ИП на упрощённой декларации: ИПН 4% с дохода (местные власти могут менять ставку от 2% до 6%), плюс взносы за себя: ОПВ 10%, СО 5%, ВОСМС 5% с базы 1,4 МЗП в месяц.":"Kazakhstan, sole proprietor on the simplified return: 4% individual income tax on income (local authorities may set the rate between 2% and 6%), plus own contributions: OPV 10%, SO 5%, VOSMS 5% on a base of 1.4 minimum wages per month.","Самозанятый":"Self-employed","Соцплатежи 4%":"Social payments 4%","ИПН 0%":"Income tax 0%","Лимит самозанятого":"Self-employed limit","Казахстан, самозанятый: подоходный налог 0%, соцплатежи 4% от дохода. Доход не должен превышать 300 МРП в месяц.":"Kazakhstan, self-employed: 0% income tax, 4% social payments on income. Income must not exceed 300 monthly calculation indices per month.","ИП на упрощёнке НДС не платят":"Sole proprietors on the simplified regime do not pay VAT","Взносы за себя за прошлый месяц":"Own contributions for the previous month","февраля и 15 августа":"February and August 15","Декларация 910 за полугодие":"Form 910 for the half-year","февраля и 25 августа":"February and August 25","Оплата налога за полугодие":"Tax payment for the half-year","Для малого бизнеса есть упрощённая декларация: 4% с дохода вместо налога на прибыль.":"Small businesses can use a simplified return: 4% of income instead of corporate income tax.","Взносы и налоги с зарплат":"Payroll contributions and taxes","Раз в квартал":"Once a quarter","Декларация по НДС":"VAT return","Годовая декларация по КПН за":"Annual corporate income tax return for","Грузия":"Georgia","Служба доходов":"Revenue Service","Малый бизнес 1%":"Small business 1%","Налог 1% с оборота":"Tax 1% of turnover","Лимит малого бизнеса":"Small business limit","Грузия, ИП со статусом малого бизнеса: 1% с оборота до 500 000 ₾ в год, расходы не вычитаются, НДС платить не нужно.":"Georgia, individual entrepreneur with small business status: 1% of turnover up to ₾500,000 per year, expenses are not deducted, no VAT.","Общий 20%":"General 20%","Налог 20% с прибыли":"Tax 20% of profit","Грузия, ИП без статуса малого бизнеса: подоходный налог 20% с прибыли.":"Georgia, individual entrepreneur without small business status: 20% income tax on profit.","Декларация и оплата налога за прошлый месяц":"Return and tax payment for the previous month","Декларация НДС, если вы плательщик":"VAT return, if you are registered","Налог 15% платится только при распределении прибыли, дивиденды облагаются ещё 5%.":"The 15% tax is paid only when profit is distributed; dividends are taxed a further 5%.","Налоги и пенсионные взносы с зарплат, НДС":"Payroll taxes and pension contributions, VAT","При выплате дивидендов":"When paying dividends","Налог на распределённую прибыль и 5% с дивидендов":"Tax on distributed profit and 5% on dividends","До 1 апреля":"By April 1,","Годовая отчётность за":"Annual reporting for","Великобритания":"United Kingdom","Взносы NIC (класс 4)":"NIC contributions (Class 4)","Великобритания, самозанятый: подоходный налог 20/40/45% после личной льготы 12 570 £ (Англия, Уэльс, Северная Ирландия) и взносы NIC класса 4: 6% с прибыли от 12 570 до 5  президента ЕЦБ 7 февраля 2027 года. Для вас это значит: ставки по вкладам и кредитам с плавающей ставкой пока не должны резко меняться.":"The deposit rate stays at 2.50% after the September increase. The regulator fears that more expensive energy could push inflation up. Christine Lagarde has announced she will leave the ECB presidency on 7 February 2027. For you this means rates on deposits and floating-rate loans should not change sharply for now.","Налоги":"Taxes","С 2027 года необлагаемый минимум в Латвии вырастет до 570 €":"From 2027 the tax-free minimum in Latvia rises to €570","Сейчас вычет составляет 550 € в месяц, с 2027 года будет 570 €. Это уже закреплено в законе. Ставки подоходного налога остаются прежними: 25,5% до 105 300 € в год и 33% выше. Экономия небольшая, около 5 € в месяц.":"The deduction is currently €550 per month and will be €570 from 2027. This is already set in law. Income tax rates stay the same: 25.5% up to €105,300 a year and 33% above. The saving is small, about €5 a month.","Самозанятым":"Self-employed","С 1 апреля 2027 года появится новый налог для небольшой подработки":"From 1 April 2027 a new tax for small side income appears","Закон вводит начальный налог микропредприятия по ставке 10% для небольшого побочного дохода. Разъяснения VID ожидаются до 1 апреля 2027 года. Если у вас небольшие доходы от съёмок или услуг, следите за условиями и порогами.":"The law introduces a starter micro-enterprise tax at 10% for small side income. VID guidance is expected before 1 April 2027. If you have small income from shoots or services, watch the conditions and thresholds.","Минимальные взносы 2 340 € в квартал для самозанятых отменены":"Minimum contributions of €2,340 per quarter for the self-employed abolished","Поправка от 16 апреля действует с 1 января 2026 года. Социальные взносы теперь считаются с фактической прибыли каждого месяца, а не с минимальной базы. Отчёты подаются до 17-го числа после квартала, платежи вносятся до 23-го.":"The 16 April amendment applies from 1 January 2026. Social contributions are now calculated on each month's actual profit rather than a minimum base. Reports are due by the 17th after the quarter, payments by the 23rd.","Инвестиции":"Investments","Сейм принял правила для криптоактивов":"Saeima adopts rules for crypto-assets","Режим инвестиционных счетов распространили на криптовалюты. Кроме того, предусмотрено разовое декларирование: налог 10% от рыночной стоимости на 31 декабря 2026 года, после чего эта стоимость становится базой для будущих расчётов. Правительству поручено до 30 декабря утвердить требования к поставщикам таких счетов.":"The investment account regime has been extended to cryptocurrencies. A one-off declaration is also provided: a 10% tax on the market value at 31 December 2026, after which that value becomes the base for future calculations. The government has been instructed to approve requirements for providers of such accounts by 30 December.","Цены":"Prices","Сниженный НДС 12% на базовые продукты действует до 30 июня 2027":"Reduced 12% VAT on basic foods applies until 30 June 2027","Пониженная ставка применяется к молоку, хлебу, курице, яйцам и ряду других основных продуктов. Мера введена в бюджете 2026 года, чтобы смягчить рост цен.":"The reduced rate applies to milk, bread, chicken, eggs and a number of other staple foods. The measure was introduced in the 2026 budget to soften price growth.","Цены производителей в Латвии ускорили рост":"Producer prices in Latvia accelerate","В сентябре цены производителей выросли на 3,1% за год, против 2,7% месяцем ранее. Такие изменения обычно с задержкой доходят до цен в магазинах.":"In September producer prices rose 3.1% year on year, against 2.7% a month earlier. Such changes usually reach shop prices with a delay.","Новости":"News","Финансы, налоги и цены. Страна:":"Finance, taxes and prices. Country:","Новости по вашей стране появятся позже, пока показаны общие":"News for your country will appear later; gener       const docs=snap.docs||[]; const items=[]; let settings=null, found=false;
      docs.forEach(d=>{const data=typeof d.data==='function'?d.data():d.data; if(!data)return;

  if(b){

    else if(s.exp/b>=.8)out.push({tone:'warn',title:T('Использовано ')+Math.round(s.exp/b*100)+T('% бюджета'),text:T('Осталось ')+money(b-s.exp)+T('. Притормозите с необязательными тратами.')});
    else out.push({tone:'good',title:T('Бюджет под контролем'),text:T('Использовано ')+Math.round(s.exp/b*100)+T('%, осталось ')+money(b-s.exp)+'.'});
  }
  if(isCur&&day>=3&&s.exp>0){
    const proj=s.exp/day*dim;
    if(b&&proj>b)out.push({tone:'warn',title:T('Прогноз выше бюджета'),text:T('В таком темпе до следующей зарплаты выйдет около ')+moneyR(proj)+T(' при лимите ')+moneyR(b)+'.'});
    else out.push({tone:'info',title:T('Прогноз расходов: ')+moneyR(proj),text:T('Считается по среднему темпу за ')+day+T(' дн. периода.')});
  }
  if(s.sav>0&&s.inc>0){const sr=s.sav/s.inc*100; out.push({tone:sr>=20?'good':'info',title:T('Отложено ')+money(s.sav),text:Math.round(sr)+T('% дохода')+(sr>=20?T('. Выше ориентира в 20%.'):T('. Ориентир: 20%.'))})}
  if(s.inc>0){
    const rate=(s.inc-s.exp)/s.inc*100;
    if(rate<0)out.push({tone:'bad',title:T('Расходы больше доходов'),text:T('Минус ')+money(s.exp-s.inc)+T(' за период. Проверьте крупные категории в аналитике.')});
    else if(s.sav>0){}
    else if(s.exp>0){
      if(rate<10)out.push({tone:'warn',title:T('Не потрачено ')+Math.round(rate)+T('% дохода'),text:T('Остаётся мало. Ориентир для накоплений: 20%, это ')+moneyR(s.inc*.2)+T(' с текущего дохода.')});
      else out.push({tone:'info',title:T('Не потрачено ')+Math.round(rate)+T('% дохода'),text:T('Можно отложить часть: ориентир 20%, это ')+moneyR(s.inc*.2)+'. '+T('Нажмите «Накопить», когда переведёте деньги.')});
    }
  }
  Object.keys(S.budget.cats).forEach(id=>{const lim=S.budget.cats[id]; const sp=s.byCat[id]||0; const c=CE.find(x=>x.id===id);
    if(c&&lim>0&&sp>lim)out.push({tone:'bad',title:c.n+T(': лимит превышен'),text:T('Потрачено ')+money(sp)+T(' при лимите ')+money(lim)+'.'})});
  const prev=sums(addMonths(m,-1));
  let worst=null; Object.keys(s.byCat).forEach(id=>{const p=prev.byCat[id]||0; const d=s.byCat[id]-p; if(p>0&&d>30&&s.byCat[id]/p>1.3&&(!worst||d>worst.d))worst={id,d,p}});
  if(worst&&(!isCur||day>=10)){const c=CE.find(x=>x.id===worst.id); out.push({tone:'warn',title:c.n+T(' выросли'),text:T('На ')+money(worst.d)+T(' больше, чем в прошлом периоде.')})}
  return out.slice(0,4);
}

const lvVsaoi=profit=>{

};
const iinCum=(profitCum,vsaoiCum,n)=>{const t=Math.max(0,profitCum-vsaoiCum-(S.biz.minUsed?0:LV.ntm*n)); return t<=LV.iinLim?t*LV.iin:LV.iinLim*LV.iin+(t-LV.iinLim)*LV.iinHi};

function taxModel(m,reg){
  reg=reg||curReg();
  if(S.country!=='LV'&&reg!=='custom')return taxModelG(m,reg);
  const yr=m.slice(0,4), rows=[]; let cp=0,cv=0,cinc=0,cpaid=0,prev=0,n=0,due=0;

    due+=d; rows.push({key,inc:b.inc,opex:b.opex,profit:b.profit,paid:b.paid,vs,ii,due:d});
  }
  return {rows,cur:rows[rows.length-1],ytd:{inc:cinc,profit:cp,paid:cpaid,due:reg==='lv'?cv+prev:due,vs:cv,iin:prev}};
}

function firmYear(m){

    t.vatOpex+=withMode('f',()=>{const b=sums(key).byCat; return FIRM_VAT_CATS.reduce((a,c)=>a+(b[c]||0),0)})}
  return t;

function firmVatIn(m){const v=FP().vat||0; return withMode('f',()=>{const b=sums(m).byCat; return FIRM_VAT_CATS.reduce((a,c)=>a+(b[c]||0),0)*v/(1+v)})}
function firmCalc(m){
  const P=FP(), c=firmMonth(m), Y=firmYear(m), n=S.firm.staff||0, vr=P.vat||0;

  const iin=clamp0(c.pay-eec-P.ntm*n)*P.pit;

  const cit=P.citF?P.citF(Y):P.cit;
  let free,std,alt=null;
  if(P.mode==='dist'){
    free=clamp0(Y.profit-Y.div*(1+cit/(1-cit)));
    std={cit:free*cit,net:free*(1-cit)*(1-(P.divTax||0))};
    if(P.alt)alt={cit:free*P.alt.cit,net:free*(1-P.alt.cit)*(1-P.alt.pit)};

}

function taxModelG(m,reg){
  const cc=CC(), rg=cc.se.regs.find(r=>r.id===reg)||cc.se.regs[0], P=regPar(rg), yr=m.slice(0,4), rows=[];
  let cp=0,cinc=0,cpaid=0,cop=0,n=0,prev=0,prevS=0,prevI=0;
  for(let k=1;k<=12;k++){
    const key=yr+'-'+pad(k); if(key>m)break; n++;
    const b=bizMonth(key); cinc+=b.inc; cp+=b.profit; cpaid+=b.paid; cop+=b.opex;
    const r=cc.se.calc(rg.id,{inc:cinc,opex:cop,profit:cp,n},P), tot=r.soc+r.inc;
    rows.push({key,inc:b.inc,opex:b.opex,profit:b.profit,paid:b.paid,vs:clamp0(r.soc-prevS),ii:clamp0(r.inc-prevI),due:clamp0(tot-prev)});
    prev=tot; prevS=r.soc; prevI=r.inc;
  }
  return {rows,cur:rows[rows.length-1],ytd:{inc:cinc,profit:cp,paid:cpaid,due:prev,vs:prevS,iin:prevI}};
}

function impNum(s){

  else if(lc>=0||ld>=0){ const sep=lc>=0?',':'.', parts=s.split(sep); if(parts.length>2||(parts[1]&&parts[1].length===3&&parts[0].length<=3&&parts[0]!=='0'&&parts[0]!==''&&parts.length===2&&false))s=parts.join(''); else if(parts.length===2&&parts[1].length===3&&parts[0].length>=1&&/^\d{1,3}$/.test(parts[0])&&parts[0]!=='0')s=parts.join(''); else s=parts.join('.') }

const PINOK=!!(window.crypto&&crypto.subtle);
const pinGet=()=>{try{return JSON.parse(localStorage.getItem('fin_pin')||'null')}catch(e){return null}};
async function pinHash(pin,salt){ const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']); const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('') }
let lk=null, lkFail=0, lkUntil=0, lkHiddenAt=0;
function lkPaint(msg){
  let o=$('#lk'); if(!o){o=document.createElement('div'); o.id='lk'; o.className='ob lk'; document.body.appendChild(o)}
  const ttl={unlock:T('Введите PIN-код'),set1:T('Придумайте PIN-код из 4 цифр'),set2:T('Повторите PIN-код'),off:T('Введите PIN-код, чтобы отключить')}[lk.m];
  o.innerHTML='<div class="obk" style="align-items:center;text-align:center"><h2 style="font-size:22px">'+ttl+'</h2><div class="lkd">'+[0,1,2,3].map(i=>'<i'+(i<lk.buf.length?' class="on"':'')+'></i>').join('')+'</div><p class="err" style="min-height:22px">'+(msg||'')+'</p></div><div class="lkp">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-act="lkd" data-v="'+n+'">'+n+'</button>').join('')+'<button data-act="lkx" class="sm">'+(lk.m==='unlock'?T('Забыли?'):T('Отмена'))+'</button><button data-act="lkd" data-v="0">0</button><button data-act="lkb" class="sm" aria-label="'+T('Стереть')+'">⌫</button></div>';
}
function lkOpen(m){ lk={m:m,buf:'',first:''}; lkPaint() }
function lkClose(){ const o=$('#lk'); if(o)o.remove(); lk=null }
async function lkDigit(d){
  if(!lk||lk.buf.length>=4)return; if(lk.m==='unlock'||lk.m==='off'){ if(Date.now()<lkUntil){lkPaint(T('Подождите немного и попробуйте снова'));return} }
  lk.buf+=d; lkPaint(); if(lk.buf.length<4)return;
  const pin=lk.buf, g=pinGet();
  if(lk.m==='set1'){ lk.first=pin; lk.buf=''; lk.m='set2'; lkPaint(); return }
  if(lk.m==='set2'){ if(pin!==lk.first){ lk.buf=''; lk.first=''; lk.m='set1'; lkPaint(T('PIN-коды не совпали, начните заново')); return }
    const salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16)).join(''); try{localStorage.setItem('fin_pin',JSON.stringify({salt:salt,hash:await pinHash(pin,salt)}))}catch(e){} lkClose(); vToast(T('PIN-код включён')); return }
  const ok=g&&(await pinHash(pin,g.salt))===g.hash;
  if(ok){ lkFail=0; if(lk.m==='off'){try{localStorage.removeItem('fin_pin')}catch(e){} lkClose(); vToast(T('PIN-код отключён'))} else lkClose(); return }
  lkFail++; lk.buf=''; if(lkFail>=5){lkUntil=Date.now()+30000; lkFail=0; lkPaint(T('Слишком много попыток. Подождите 30 секунд'))} else lkPaint(T('Неверный PIN-код'));
}

  ['pointerup','pointermove','pointercancel','scroll'].forEach(n=>document.addEventListener(n,stop,true));
  document.addEventListener('click',e=>{ if(fired){ e.stopPropagation(); e.preventDefault(); fired=false } },true);
})();
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el)return; const a=el.dataset.act, id=el.dataset.id, v=el.dataset.v;
  if(['add','addi','adds','addfixed','voice'].includes(a)&&locked(mode)){openPaywall(mode);return}
  switch(a){
    case 'pie': pieSel=(id&&pieSel!==id)?id:null; render(); break;
    case 'paywall': openPaywall(v); break;
    case 'sprev': case 'snext': {const i=Math.max(0,Math.min(2,MODES.indexOf(mode)+(a==='snext'?1:-1))); const sl=$('#slides'); if(sl)sl.scrollTo({left:i*sl.clientWidth,behavior:'smooth'}); break}
    case 'unlock': S.plan[v]=true; touch(); closeModal(); mode=v; render(); vToast(v==='f'?T('Фирма и всё приложение включены (тест)'):T('Раздел «')+PLANS[v].name+T('» включён (тест)')); break;
    case 'fvat': S.firm.vat=v==='1'; touch(); render(); break;
    case 'fstaff': askNum(T('Сколько сотрудников'),String(S.firm.staff||''),T('Для оценки подоходного налога с зарплат. Владельца считайте, если он получает зарплату.'),val=>{S.firm.staff=Math.max(0,Math.round(val)); touch(); render()}); break;
    case 'tab': view=v; render(); $('#main').scrollTop=0; break;
    case 'prevm': curMonth=addMonths(curMonth,-1); render(); break;
    case 'nextm': curMonth=addMonths(curMonth,1); render(); break;
    case 'hf': hf=v; render(); break;
    case 'add': openTx(); break;
    case 'addfixed': openFixed(); break;
    case 'news': view=view==='news'?'home':'news'; render(); window.scrollTo(0,0); {const m_=$('#main'); if(m_)m_.scrollTop=0} break;
    case 'nf': newsF=v; render(); break;
    case 'voice': voiceStart(); break;
    case 'vstop': if(vLive)voiceFinish(); else { vFin++; vPill(false) } break;
    case 'vqgo': quickGo(); break;
    case 'vqx': quickClose(); break;
    case 'vundo': voiceUndo(); break;
    case 'vmic': if(vc.dict){ if(vc.on){vcStop().then(()=>{if(vc.base.trim())vcParse()})} else {try{vc.dict.start().catch(()=>{})}catch(e){}} } break;
    case 'vgo': vcStop().then(vcParse); break;
    case 'vback': vc.items=null; paintVoice(); break;
    case 'vsave': vcSave(); break;
    case 'vdel': vc.items.splice(+id,1); if(!vc.items.length){vc.items=null} paintVoice(); break;
    case 'addi': openTx(); draft.t='i'; draft.cat=listFor('i',draft.b)[0].id; paintTx(); break;
    case 'adds': openSave(); break;
    case 'svpick': { const i=$('#svn'); if(i)i.value=svNames[+el.dataset.i]||''; break }
    case 'svsave': saveSave(); break;
    case 'svdel': { const o=S.tx.find(x=>x.id===svEdit); if(o){S.tx=S.tx.filter(x=>x.id!==svEdit); touch(mk(o.date))} svEdit=null; closeModal(); render(); break }
    case 'editfixed': openFixed(id); break;
    case 'fcat': draft.cat=id; paintFx(); break;
    case 'savefixed': saveFixed(); break;
    case 'delfixed': S.fixed=S.fixed.filter(x=>x.id!==editId); touch(); closeModal(); render(); break;
    case 'remind': openRemind(); break;
    case 'rmon': RM().on=v==='1'; touch(); closeModal(); openRemind(); if(RM().on&&'Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission().then(()=>{closeModal();openRemind()})}catch(e){}} render(); break;
    case 'rmsave': { const t=$('#rmt'); if(t&&/^\d\d:\d\d$/.test(t.value)){RM().time=t.value; touch()} closeModal(); render(); break }
    case 'rmperm': try{Notification.requestPermission().then(()=>{closeModal();openRemind()})}catch(e){} break;
    case 'install': if(installEv){installEv.prompt(); installEv=null; closeModal()} break;
    case 'rmics': { const txt=icsText(); try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'})); a.download='finance-reminder.ics'; document.body.appendChild(a); a.click(); a.remove()}catch(e){} break }
    case 'import': openImport(); break;
    case 'imsec': if(imp){imp.sec=v; imp.rows.forEach(r=>{r.manual=false}); impRefresh(); impPaint()} break;
    case 'imgo': if(imp)impCommit(); break;
    case 'invnew': invNew(); break;
    case 'invopen': { const o=(S.inv||[]).find(x=>x.id===id); if(o)invOpen(JSON.parse(JSON.stringify(o))); break }
    case 'selfedit': selfEdit(); break;
    case 'selfsave': selfSave(); break;
    case 'ivadd': ivd.items.push({d:'',q:1,p:''}); ivItems(); break;
    case 'ivrm': ivd.items.splice(+el.dataset.i,1); ivItems(); ivTot(); break;
    case 'ivsave': ivSave(); break;
    case 'ivpaid': ivPaid(); break;
    case 'ivprint': { const o=ivSave(true); if(o)ivPrint(o); break }
    case 'ivshare': { const o=ivSave(true); if(!o)break; const t=ivText(o); if(o.status==='draft'){o.status='sent'; touch()} if(navigator.share){navigator.share({text:t}).catch(()=>{})} else { try{navigator.clipboard.writeText(t); vToast(T('Текст счёта скопирован'))}catch(e){} } break }
    case 'ivdel': askConfirm(T('Удалить счёт?'),T('Запись о счёте исчезнет. Уже записанный доход останется.'),T('Удалить'),()=>{ S.inv=(S.inv||[]).filter(x=>x.id!==ivd.id); touch(); ivd=null; closeModal(); render() }); break;
    case 'pvprint': try{window.print()}catch(e){} break;
    case 'pvclose': { const p=$('#pv'); if(p)p.remove(); break }
    case 'rcview': if(draft&&draft.rcData)rcView(draft.rcData); break;
    case 'rcdel': draft.rcData=null; draft.rcDel=true; rcPaint(); break;
    case 'obnext': if(obI<OBS.length-1){obI++; obPaint()} else obDone(); break;
    case 'obskip': obDone(); break;
    case 'privacy': window.open('privacy.html'+(LANG==='en'?'?lang=en':''),'_blank'); break;
    case 'pin': closeModal(); lkOpen(pinGet()?'off':'set1'); break;
    case 'lkd': lkDigit(el.dataset.v); break;
    case 'lkb': if(lk&&lk.buf){lk.buf=lk.buf.slice(0,-1); lkPaint()} break;
    case 'lkx': if(lk&&lk.m==='unlock')lkForgot(); else lkClose(); break;
    case 'wl': openWl(v); break;
    case 'wlsend': wlSend(v); break;
    case 'tt': ttN++; if(ttN>=5){ttN=0; try{localStorage.setItem('fin_test','1')}catch(e){} TEST_UNLOCK=true; closeModal(); render(); vToast('Test mode on')} break;
    case 'testoff': try{localStorage.setItem('fin_test','0')}catch(e){} TEST_UNLOCK=false; if(locked(mode))mode='p'; closeModal(); render(); vToast(T('Тестовый доступ выключен')); break;
    case 'catsedit': catFrom(v==='fx'?'fx':'tx',false); break;
    case 'catplus': catFrom(v==='fx'?'fx':'tx',true); break;
    case 'catdone': catReturn(); break;
    case 'cats': CATRET=null; openCats(); break;
    case 'cstype': CS.t=v; paintCats(); break;
    case 'catedit': catEdit(id); break;
    case 'catnew': catEdit(null); break;
    case 'catback': paintCats(); break;
    case 'catcolor': cd.c=v; paintSw(); { const ci=$('#cec'); if(ci)ci.value=v } break;
    case 'catsave': catSave(); break;
    case 'catdel': catDel(); break;
    case 'catmove': catMoveAndRemove(cd.id,id); break;
    case 'catkeep': catRemove(cd.id); break;
    case 'catrestore': { const C=S.cats; C.hide=C.hide.filter(x=>x!==id); touch(); applyCats(); paintCats(); render(); break }
    case 'catreset': askConfirm(T('Вернуть стандартные категории?'),T('Свои категории исчезнут, названия и цвета вернутся. Операции в своих категориях станут «Без категории».'),T('Вернуть'),()=>{ S.cats={ov:{},hide:[],add:[]}; touch(); applyCats(); render(); openCats() }); break;
    case 'theme': applyTheme(v); openSettings(); break;
    case 'hide': HIDE=!HIDE; try{localStorage.setItem('fin_hide',HIDE?'1':'0')}catch(e){} document.body.classList.toggle('hid',HIDE); render(); vToast(HIDE?T('Суммы скрыты'):T('Суммы показаны')); break;
    case 'quick': quickAdd(+el.dataset.i); break;
    case 'payfixed': payFixed(id); break;
    case 'unpayfixed': unpayFixed(id); break;
    case 'edit': openTx(id); break;
    case 'close': closeModal(); break;
    case 'fxpick': fxPick(+el.dataset.i); break;
    case 'addfixed2': closeModal(); openFixed(); break;
    case 'type': draft.t=v; draft.cat=listFor(v,draft.b)[0].id; paintTx(); break;
    case 'pickcat': draft.cat=id; if(draft.fid){const f0=S.fixed.find(x=>x.id===draft.fid); if(!f0||f0.cat!==id)draft.fid=null} paintTx(); if(OTHER_IDS.includes(id)){const e=$('#scn'); if(e)setTimeout(()=>e.focus(),30)} break;
    case 'scpick': { const e=$('#scn'); if(e)e.value=scNames[+el.dataset.i]||''; break }
    case 'savetx': saveTx(); break;
    case 'qdel': { const o=delTx(id); if(o){ lastDel=o; render(); delToast() } break }
    case 'undel': { if(lastDel){ S.tx.push(lastDel); if(lastDel.gid){const g=S.goals.find(x=>x.id===lastDel.gid); if(g)g.saved=Math.round((g.saved+lastDel.amt)*100)/100} touch(mk(lastDel.date)); lastDel=null; vToastHide(); render() } break }
    case 'deltx': { const o=S.tx.find(x=>x.id===editId); if(o){S.tx=S.tx.filter(x=>x.id!==editId); if(o.gid){const g=S.goals.find(x=>x.id===o.gid); if(g){g.saved=Math.max(0,Math.round((g.saved-o.amt)*100)/100); touch()}} touch(mk(o.date))} closeModal(); render(); break; }
    case 'setpay': askNum(T('День зарплаты'),S.payday,T('Число месяца, когда приходят деньги. Период считается от этого дня до следующей зарплаты.'),x=>{S.payday=Math.min(31,Math.max(1,Math.round(x)||1)); touch(); curMonth=periodOfDate(todayStr()); render()}); break;
    case 'cleartbl': {
      const sec=x=>secOf(x)===mode, pick=x=>v==='s'?isSav(x):v==='e'?(x.t==='e'&&!isSav(x)):x.t==='i', a=S.tx.filter(x=>pick(x)&&sec(x)&&periodOfDate(x.date)===curMonth), all=S.tx.filter(x=>pick(x)&&sec(x));
      const nm=v==='i'?T('доходы'):v==='s'?T('сбережения'):T('расходы');
      if(!all.length){sheet(T('<h2>Очистить ')+nm+T('</h2><p class="mut">Здесь нечего очищать.</p><div class="btns"><button class="btn ghost" data-act="close">Закрыть</button></div>'));break}
      sheet(T('<h2>Очистить ')+nm+T('</h2><p class="mut">Раздел «')+({p:T('Личные'),b:T('Самозанятый'),f:T('Фирма')}[mode])+T('». Удалённые записи не вернуть.</p><div class="btns" style="flex-direction:column"><button class="btn ghost" id="cp"')+(a.length?'':' disabled style="opacity:.4"')+T('>Только за этот период (')+a.length+T(')</button><button class="btn danger" id="ca">За всё время (')+all.length+T(')</button><button class="btn ghost" data-act="close">Отмена</button></div>'));
      const run=list=>{const ids=new Set(list.map(x=>x.id)); const ms=new Set(list.map(x=>mk(x.date))); S.tx=S.tx.filter(x=>!ids.has(x.id)); ms.forEach(touch); closeModal(); render()};
      $('#cp').onclick=()=>{if(a.length)run(a)}; $('#ca').onclick=()=>run(all); break; }
    case 'clearsec': askConfirm(T('Стереть раздел «')+({p:T('Личные'),b:T('Самозанятый'),f:T('Фирма')}[mode])+'»?',T('Все доходы и расходы этого раздела будут удалены. Второй раздел и настройки не изменятся.'),T('Стереть'),()=>{
      const rm=S.tx.filter(x=>secOf(x)===mode); const ms=new Set(rm.map(x=>mk(x.date))); S.tx=S.tx.filter(x=>secOf(x)!==mode); S.fixed=S.fixed.filter(f=>secOf(f)!==mode); touch(); ms.forEach(touch); render()}); break;
    case 'mode': {const sl=$('#slides'); if(sl&&view==='home'){sl.scrollTo({left:MODES.indexOf(v)*sl.clientWidth,behavior:'smooth'}); break}} mode=v; curMonth=periodOfDate(todayStr()); if(mode==='b')ensureBizDemo(); if(mode==='f')ensureFirmDemo(); render(); $('#main').scrollTop=0; break;
    case 'minuse': S.biz.minUsed=v==='1'; touch(); render(); break;
    case 'regime': S.biz.regime=v; touch(); render(); break;
    case 'setvbase': askNum(T('База соцвзносов, € в месяц'),S.biz.vsaoiBase||780,T('Не меньше 780 €. Чем выше база, тем больше взносы и будущая пенсия.'),x=>{S.biz.vsaoiBase=Math.max(780,x); touch(); render()}); break;
    case 'setrate': askNum(T('Ставка налога, %'),S.biz.rate,T('Какую долю вы откладываете на налоги.'),x=>{S.biz.rate=Math.min(100,x); touch(); render()}); break;
    case 'base': S.biz.base=v; touch(); render(); break;
    case 'settotal': askNum(T('Бюджет на период'),S.budget.total||'',T('Общий лимит расходов. Ноль убирает бюджет.'),x=>{S.budget.total=x; touch(); render()});
      if(S.budget.total){const rb=document.createElement('button'); rb.className='btn ghost'; rb.style.color='var(--bad)'; rb.textContent=T('Убрать бюджет'); rb.onclick=()=>{closeModal(); S.budget.total=0; touch(); render()}; $('#sheet .btns').prepend(rb)} break;
    case 'setcat': { const c=CE.find(x=>x.id===id); askNum(T('Лимит: ')+c.n,S.budget.cats[id]||'',T('Сколько за период вы готовы тратить на эту категорию. Ноль убирает лимит.'),x=>{if(x>0)S.budget.cats[id]=x; else delete S.budget.cats[id]; touch(); render()});
      if(S.budget.cats[id]){const rb=document.createElement('button'); rb.className='btn ghost'; rb.style.color='var(--bad)'; rb.textContent=T('Убрать лимит'); rb.onclick=()=>{closeModal(); delete S.budget.cats[id]; touch(); render()}; $('#sheet .btns').prepend(rb)} break; }
    case 'addgoal': openGoal(); break;
    case 'editgoal': openGoal(id); break;
    case 'fund': fundGoal(id); break;
    case 'delgoal': { const g=S.goals.find(x=>x.id===id); askConfirm(T('Удалить цель?'),'«'+g.name+T('» исчезнет. Записи в «Сбережениях» останутся.'),T('Удалить'),()=>{S.goals=S.goals.filter(x=>x.id!==id); touch(); render()}); break; }
    case 'settings': openSettings(); break;
    case 'country': openCountry(false); break;
    case 'lang': setLang(v); break;
    case 'setcountry': pickCountry(v); break;
    case 'setparam': { const rg=CC().se.regs.find(r=>r.param&&r.param.k===v); if(rg)askNum(rg.param.label,S.biz[v]!=null?S.biz[v]:rg.param.def,rg.param.hint,x=>{S.biz[v]=Math.min(100,x); touch(); render()}); break; }
    case 'cur': S.cur=v; touch(); openSettings(); render(); break;
    case 'csv': { const t=csv(); sheet(T('<h2>Экспорт в CSV</h2><p class="mut">Скопируйте текст и вставьте в таблицу или заметки.</p><textarea id="ct" class="inp" readonly></textarea><div class="btns"><button class="btn ghost" data-act="close">Закрыть</button><button class="btn" id="cc">Скопировать</button></div>')); $('#ct').value=t;
      $('#cc').onclick=async()=>{try{await navigator.clipboard.writeText(t);$('#cc').textContent=T('Скопировано')}catch(e){$('#ct').select();$('#cc').textContent=T('Выделено, скопируйте вручную')}}; break; }
    case 'clrdemo': askConfirm(T('Удалить примеры?'),T('Примерные операции, бюджет и цели исчезнут. Ваши собственные записи останутся.'),T('Удалить'),()=>{
      const ms=new Set(S.tx.filter(t=>t.demo).map(t=>mk(t.date))); S.tx=S.tx.filter(t=>!t.demo); S.goals=S.goals.filter(g=>!g.demo); S.fixed=S.fixed.filter(f=>!f.demo);
      if(S.demo){S.budget={total:0,cats:{}}} S.demo=false; ms.forEach(m=>touch(m)); touch(); render()}); break;
    case 'reset': askConfirm(T('Стереть все данные?'),T('Операции, бюджеты и цели будут удалены без возможности вернуть.'),T('Стереть всё'),()=>{
      const ms=new Set(S.tx.map(t=>mk(t.date))); S.tx=[]; S.goals=[]; S.fixed=[]; S.inv=[]; S.seller=null; S.learn={}; S.remind={on:false,time:'20:00'}; S.budget={total:0,cats:{}}; S.demo=false; RC.clear(); ms.forEach(m=>touch(m)); touch(); render()}); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

let askedC=false;

/* ---------- первый запуск: обучение на 3 экрана ---------- */
const OBS=[
 {n:'1',t:T('Все деньги в одном месте'),d:T('Личные финансы, самозанятость и фирма: три отдельных счёта. Переключайте их свайпом по карте.')},
 {n:'2',t:T('Записывайте голосом'),d:T('Скажите «потратил 12 на кофе» или «получил зарплату 1500», и операция запишется сама. Частые траты добавляются одним нажатием.')},
 {n:'3',t:T('Знайте, сколько можно тратить'),d:T('Приложение считает дневной лимит, напоминает внести траты и следит за налогами и платежами. Все данные хранятся только на вашем телефоне. Мы их не получаем.')}
];
let obI=0;
function obSeen(){ try{return !!localStorage.getItem('fin_ob')}catch(e){return false} }
function obDone(){ try{localStorage.setItem('fin_ob','1')}catch(e){} const o=$('#ob'); if(o)o.remove(); if(!S.cset)openCountry(true) }
function obPaint(){
  let o=$('#ob'); if(!o){o=document.createElement('div'); o.id='ob'; o.className='ob'; document.body.appendChild(o)}
  const s=OBS[obI], last=obI===OBS.length-1;
  o.innerHTML='<div class="obk"><div class="obn">'+s.n+'</div><h2>'+s.t+'</h2><p>'+s.d+'</p></div><div class="obd">'+OBS.map((x,i)=>'<i'+(i===obI?' class="on"':'')+'></i>').join('')+'</div><div class="btns"><button class="btn ghost" data-act="obskip"'+(last?' style="visibility:hidden"':'')+'>'+T('Пропустить')+'</button><button class="btn" data-act="obnext">'+(last?T('Начать'):T('Далее'))+'</button></div>';
}
function maybeOnboard(){ if(obSeen()||S.cset||S.tx.some(t=>!t.demo)){ try{localStorage.setItem('fin_ob','1')}catch(e){} return false } obI=0; obPaint(); return true }
function maybeAskCountry(){ if($("#ob"))return; if(maybeOnboard())return; if(S.cset||askedC)return; askedC=true; setTimeout(()=>{ if(!S.cset&&$('#modal').hidden)openCountry(true) },250) }
load(); curMonth=periodOfDate(todayStr()); render(); initDb().finally(()=>setTimeout(()=>{ if(!COL)maybeAskCountry() },1500));
</script>
