<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои финансы</title>
<meta name="theme-color" content="#080a0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: carbon black phone app with steel-blue light, frosted glass panels, flat sections between them */
:root{
  --bg:#080A0E; --surface:#10141A; --soft:#161B23;
  --line:rgba(233,237,243,.08); --line2:rgba(233,237,243,.18);
  --ink:#E9EDF3; --muted:rgba(233,237,243,.64); --faint:rgba(233,237,243,.4);
  --accent:#A9BDD3; --accent-hi:#DCE8F5; --accent-ink:#0A0D12; --bar:#7FA3D6;
  --good:#5BD6A0; --bad:#FF4A3F; --warn:#F2C260; --red:#FF3B30;
  --card:linear-gradient(165deg,#1B222C 0%,#0E1217 70%);
  --lift:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(233,237,243,.06),0 2px 4px rgba(0,0,0,.5),0 22px 40px -16px rgba(0,0,0,.85),0 50px 90px -40px rgba(30,60,110,.45);
  --display:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 620px at -6% 28%,rgba(40,62,104,.2),transparent 60%),radial-gradient(1000px 600px at 90% 100%,rgba(52,80,124,.16),transparent 60%),var(--bg)}
::selection{background:var(--accent);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:4px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 16px;gap:6px}
.brand{display:flex;align-items:center;gap:8px}
.months{display:flex;align-items:center}
.months b{font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.07em;font-variant-numeric:tabular-nums;min-width:200px;text-align:center;text-transform:uppercase;color:var(--ink)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.ib svg{width:19px;height:19px}
main{flex:1;overflow-y:auto;padding:12px 16px 120px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);box-shadow:var(--lift);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
.mut{color:var(--muted);font-size:14px}
.hero{gap:14px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(233,237,243,.07),0 2px 6px rgba(0,0,0,.6),0 40px 70px -24px rgba(0,0,0,.9),0 60px 120px -50px rgba(60,100,170,.55)}
.big{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.big.neg{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>div{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:10px 12px}
.two small{display:block;color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.two b{font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.two .i b{color:var(--good)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{color:var(--accent-hi);font-size:13px;font-weight:600}
.link:hover{color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--faint);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;font-size:13.5px}
.amt.i{color:var(--good)}
.btn{background:linear-gradient(180deg,#F3F6FA,#B4C0CF);color:#0A0D12;font-weight:600;padding:13px 18px;border-radius:12px;text-align:center;flex:1;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.18),0 14px 30px -12px rgba(120,160,215,.5)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(233,237,243,.12),0 10px 24px -10px rgba(0,0,0,.8)}
.btn.danger{background:linear-gradient(180deg,#ff6a5f,#d62a20);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 30px -12px rgba(255,59,48,.5)}
.btns{display:flex;gap:8px;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.chip.on{background:linear-gradient(180deg,#F3F6FA,#B4C0CF);color:#0A0D12;box-shadow:inset 0 1px 0 #fff}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0}
.ins .tag{width:3px;align-self:stretch;border-radius:2px;flex:none}
.ins b{display:block;font-weight:600}
.ins span{color:var(--muted);font-size:14px}
.t-good{background:var(--good)}.t-warn{background:var(--warn)}.t-bad{background:var(--bad)}.t-info{background:var(--bar)}
.gh{display:flex;justify-content:space-between;color:var(--faint);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;padding:0 2px}
.demo{border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);line-height:1.5}
.demo button{color:var(--accent-hi);font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap;text-transform:uppercase;letter-spacing:.12em}
.cr{display:flex;flex-direction:column;gap:7px;padding:9px 0;border-top:1px solid var(--line);width:100%}
.cr:first-of-type{border-top:0}
.cr .l{display:flex;align-items:center;gap:10px}
.cr .l .n{flex:1;font-weight:500}
.cr .l .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:12.5px}
.cr .l .v small{color:var(--faint);font-weight:400}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--faint);font-size:9.5px;font-family:var(--mono)}
.leg{display:flex;gap:14px;color:var(--faint);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
nav{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;padding:6px 8px 12px}
nav .tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--faint);padding:7px 0 6px;text-align:center;position:relative}
nav .tb svg{width:21px;height:21px}
nav .tb.on{color:var(--accent-hi)}
nav .tb.on::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--accent-hi);box-shadow:0 0 12px rgba(169,189,211,.8);border-radius:2px}
.fab{width:56px;height:56px;border-radius:18px;background:linear-gradient(180deg,#F3F6FA,#B4C0CF);color:#0A0D12;display:grid;place-items:center;margin:-28px auto 0;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 5px var(--bg),0 14px 34px -6px rgba(120,160,215,.65)}
.fab svg{width:26px;height:26px}
.modal{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-end}
.modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(4,6,9,.8);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--card);box-shadow:var(--lift);border-radius:20px 20px 0 0;padding:20px 16px 26px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-stretch:118%;font-weight:700;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:3px}
.seg.mode{grid-template-columns:repeat(3,1fr)}
.seg.mode button{padding:9px 4px;white-space:nowrap}
.seg button{text-align:center;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(233,237,243,.12)}
.inp{width:100%;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line2);border:0;border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);outline:none;transition:box-shadow .2s}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--accent-hi),0 0 18px -4px rgba(120,160,215,.5)}
.inp.amount{font-family:var(--display);font-stretch:118%;font-size:32px;font-weight:700;padding:14px;letter-spacing:-.01em}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
label.f .inp{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:15px}
.sheet .lab{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.err{color:var(--bad);font-size:14px}
.empty{text-align:center;color:var(--faint);padding:28px 8px;font-family:var(--mono);font-size:12px;letter-spacing:.04em}
textarea.inp{height:140px;font-size:12px;font-family:var(--mono);resize:none}
input[type=date]{color-scheme:dark}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.7,.3,1)}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* glass layer: fewer boxes, frosted panels over soft blue light */
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(38% 30% at 82% 12%,rgba(98,150,255,.40),transparent 70%),radial-gradient(34% 28% at 6% 46%,rgba(70,120,210,.32),transparent 70%),radial-gradient(40% 30% at 72% 92%,rgba(120,170,235,.28),transparent 70%),radial-gradient(22% 18% at 30% 6%,rgba(150,120,255,.18),transparent 70%)}
@media (prefers-reduced-motion:no-preference){body::before{animation:drift 22s ease-in-out infinite alternate}@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3%,2%,0) scale(1.06)}}}
#app{z-index:1}
.card:not(.g){background:none;box-shadow:none;border-radius:0;padding:16px 2px 4px;border-top:1px solid rgba(255,255,255,.1)}
main>.card:not(.g):first-child{border-top:0;padding-top:4px}
.card.g,.sheet{backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 0 1px rgba(255,255,255,.11),0 24px 60px -24px rgba(0,0,0,.75)}
.card.g{border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 60%),rgba(10,14,22,.30)}
.card.hero.g{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.13),0 30px 80px -28px rgba(70,120,210,.55)}
.sheet{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 60%),rgba(12,17,26,.72)}
.row,.cr,.ins{border-top-color:rgba(255,255,255,.08)}
.two>div{background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip,.seg,.inp{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip{background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.demo{background:rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,255,255,.2)}
nav{left:12px;right:12px;bottom:10px;border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:6px 8px 8px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04)),rgba(12,17,26,.5);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 50px -16px rgba(0,0,0,.8)}
.fab{box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 5px rgba(8,10,14,.45),0 14px 34px -6px rgba(120,160,215,.7)}
nav .tb.on::before{top:-6px}
main{padding-bottom:128px}
/* tables and self-employed */
.mode{margin:2px 16px 2px;flex:none}
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500;text-align:left;padding:2px 6px 8px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:10px 6px;border-top:1px solid rgba(255,255,255,.08);vertical-align:middle}
.tbl td.d{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;width:1%}
.wh{display:flex;align-items:center;gap:8px;min-width:0}
.wh b{font-weight:600;display:block}
.wh small{display:block;color:var(--faint);font-size:12px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:rgba(255,255,255,.04)}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent-hi);outline-offset:-2px}
.tbl tfoot td{border-top:1px solid rgba(255,255,255,.24);font-weight:600;padding-top:12px}
.tsum{font-family:var(--display);font-stretch:118%;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tsum.i{color:var(--good)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
.kv:first-of-type{border-top:0}
.kv b{font-family:var(--mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.kv.strong{font-weight:600}
.kv span{min-width:0}
.kv small{display:block;color:var(--faint);font-size:12px;font-weight:400;margin-top:2px;line-height:1.35}
.amt.s{color:var(--bar)}
.tsum.s{color:var(--bar)}
.two .sv b{color:var(--bar)}
.two b{font-size:15px}

.fx{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}
.fx:first-child{border-top:0}
.fxn{flex:1;min-width:0;cursor:pointer}
.fxn b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxn small{display:block;color:var(--faint);font-size:12px;margin-top:1px}
.fxn small.late{color:var(--bad)}
.fx .amt{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.paybtn{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--accent-hi);background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.1);flex:none}
.paybtn.done{color:#06140d;background:var(--good);box-shadow:none;width:32px;height:32px;padding:0;display:grid;place-items:center}

.acct{position:relative;margin:-12px -16px 0;padding:22px 0 6px;display:flex;flex-direction:column;gap:14px}
.acct::before{content:'';position:absolute;left:0;right:0;top:-70px;height:420px;background:radial-gradient(60% 62% at 50% 42%,rgba(110,150,225,.42),rgba(60,90,160,.14) 55%,transparent 75%);pointer-events:none}
.slides{position:relative;padding:34px 0;margin:-34px 0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;text-align:center;padding:0 16px;height:262px;padding-bottom:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.slide .sub{position:absolute;left:0;right:0;bottom:0}
.slide>*:not(.stage){position:relative;z-index:2}
.slide .al{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;padding-left:.22em;color:var(--ink);width:100%;text-align:center;line-height:1.1}
.slide .ap{font-size:13px;font-weight:500;color:var(--muted);margin-top:-6px;letter-spacing:.02em}
.slide .big{font-size:46px;font-weight:600;letter-spacing:-.02em;margin-top:8px;color:#fff;text-shadow:0 2px 24px rgba(120,160,230,.35)}
.slide .big .cu{font-size:.58em;font-weight:600;color:var(--accent-hi);margin-left:.18em;letter-spacing:0}
.slide .sub{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.slide .g1{color:var(--good)}
.slide .g3{color:var(--bar)}
.slide.lk .lkb{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 22px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);cursor:pointer;color:#fff}
.slide.lk .lkb svg{width:26px;height:26px}.slide.lk .lkb b{font-size:20px;font-weight:700}.slide.lk .lkb span{font-size:14px;color:var(--accent-hi)}
.pw ul{margin:10px 0 14px;padding-left:20px;line-height:1.55}.pw .big small{font-size:15px;color:var(--muted);font-weight:500}.pw .btn{display:block;text-align:center;margin-bottom:8px;text-decoration:none}
.sch{display:none}
@media (hover:hover) and (pointer:fine){
 .sch{display:grid;place-items:center;position:absolute;top:128px;width:42px;height:42px;border-radius:50%;z-index:5;color:#fff;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;transition:background .2s}
 .sch:hover{background:rgba(255,255,255,.24)}
 .sch.l{left:max(12px,calc(50% - 330px))}.sch.r{right:max(12px,calc(50% - 330px))}
 .sch svg{width:20px;height:20px}
 .slides{cursor:grab}
}
@media (min-width:900px){
 #app{max-width:1080px}
 header{padding:14px 20px 8px}
 main{display:grid;grid-template-columns:1fr 1fr;align-items:start;column-gap:22px;padding:12px 24px 128px}
 main>.acct,main>.demo,main>.seg,main>p,main>.pw,main>.hd{grid-column:1/-1}
 .acts{max-width:560px;width:100%;align-self:center}
 nav{left:50%;right:auto;width:560px;margin-left:-280px}
 .modal{align-items:center;justify-content:center}
 .modal .sheet{width:520px;max-height:88%;border-radius:22px}
 .seg.mode{max-width:520px;margin-left:auto;margin-right:auto}
}

ля":"By April 30","Годовая декларация о доходах за прошлый год":"Annual income return for last year","До 20-го числа":"By the 20th","Декларация по НДС за прошлый месяц, если вы плательщик":"VAT return for the previous month, if you are registered","До 10-го каждого месяца":"By the 10th of each month","Форма TSD: налоги и взносы с зарплат":"TSD form: payroll taxes and contributions","Декларация НДС (KMD) за прошлый месяц":"VAT return (KMD) for the previous month","Налог 22/78 вносится вместе с декларацией TSD":"The 22/78 tax is paid together with the TSD return","До 30 июня":"By June 30,","Литва":"Lithuania","Индивид. деятельность":"Individual activity","Подоходный налог (GPM)":"Income tax (GPM)","Лимит дохода индивидуальной деятельности":"Individual activity income limit","Литва, индивидуальная деятельность: расходы по факту или 30% дохода без чеков. Налог около 5% с первых 20 000 € прибыли, дальше растёт до 20–32%. Взносы Sodra 19,5% с 90% прибыли.":"Lithuania, individual activity: actual expenses or 30% of income without receipts. About 5% tax on the first €20,000 of profit, rising to 20–32% above that. Sodra contributions of 19.5% on 90% of profit.","До 15-го числа":"By the 15th","Взносы Sodra за прошлый месяц":"Sodra contributions for the previous month","До 1 мая":"By May 1","До 25-го числа":"By the 25th","Декларация по НДС, если вы плательщик":"VAT return, if you are registered","Ставка 7% действует для малых компаний с доходом до 300 000 €, в первые два года возможно 0%.":"The 7% rate applies to small companies with income up to €300,000; 0% may apply in the first two years.","До 15-го каждого месяца":"By the 15th of each month","Взносы Sodra и налог с зарплат":"Sodra contributions and payroll tax","До 25-го":"By the 25th","Декларация НДС за прошлый месяц":"VAT return for the previous month","До 15 июня":"By June 15,","Налог на прибыль и годовая отчётность за":"Corporate income tax and annual reporting for","Польша":"Poland","здоровье":"health","Налог ryczałt шие доходы от съёмок или услуг, следите за условиями и порогами.":"The law introduces a starter micro-enterprise tax at 10% for small side income. VID guidance is expected before 1 April 2027. If you have small income from shoots or services, watch the conditions and thresholds.","Минимальные взносы 2 340 € в квартал для самозанятых отменены":"Minimum contributions of €2,340 per quarter for the self-employed abolished","Поправка от 16 апреля действует с 1 января 2026 года. Социальные взносы теперь считаются с фактической прибыли каждого месяца, а не с минимальной базы. Отчёты подаются до 17-го числа после квартала, платежи вносятся до 23-го.":"The 16 April amendment applies from 1 January 2026. Social contributions are now calculated on each month's actual profit rather than a minimum base. Reports are due by the 17th after the quarter, payments by the 23rd.","Инвестиции":"Investments","Сейм принял правила для криптоактивов":"Saeima adopts rules for crypto-assets","Режим инвестиционных счетов распространили на криптовалюты. Кроме того, предусмотрено разовое декларирование: налог 10% от рыночной стоимости на 31 декабря 2026 года, после чего эта стоимость становится базой для будущих расчётов. Правительству поручено до 30 декабря утвердить требования к поставщикам таких счетов.":"The investment account regime has been extended to cryptocurrencies. A one-off declaration is also provided: a 10% tax on the market value at 31 December 2026, after which that value becomes the base for future calculations. The government has been instructed to approve requirements for providers of such accounts by 30 December.","Цены":"Prices","Сниженный НДС 12% на базовые продукты действует до 30 июня 2027":"Reduced 12% VAT on basic foods applies until 30 June 2027","Пониженная ставка применяется к молоку, хлебу, курице, яйцам и ряду других основных продуктов. Мера введена в бюджете 2026 года, чтобы смягчить рост цен.":"The reduced rate applies to milk, bread, chicken, eggs and a number of other staple foods. The measure was introduced in the 2026 budget to soften price growth.","Цены производителей в Латвии ускорили рост":"Producer prices in Latvia accelerate","В сентябре цены производителей выросли на 3,1% за год, против 2,7% месяцем ранее. Такие изменения обычно с задержкой доходят до цен в магазинах.":"In September producer prices rose 3.1% year on year, against 2.7% a month earlier. Such changes usually reach shop prices with a delay.","Новости":"News","Финансы, налоги и цены. Страна:":"Finance, taxes and prices. Country:","Новости по вашей стране появятся позже, пока показаны общие":"News for your country will appear later; general news is shown for now","Подборка обновлена":"Selection updated","Это не налоговая консультация.":"This is not tax advice.","Все":"All","Источник:":"Source:","Подсказки":"Tips","Последние операции":"Recent transactions","В этом периоде операций нет":"No transactions in this period","Сейчас показаны примеры. Укажите день зарплаты и очистите их, чтобы начать со своих данных.":"Sample data is shown. Set your payday and clear it to start with your own data.","Очистить":"Clear","Дата":"Date","Откуда":"From","Куда":"To","На что":"For","Итого":"Total","Пока пусто. Новые записи попадут сюда сами.":"Nothing here yet. New entries will appear here automatically.","Получено":"Received","Остаток за период":"Balance for the period","Расходы по дням":"Spending by day","макс.":"max","Доходы и расходы за 6 месяцев":"Income and spending over 6 months","Доходы":"Income","Расходы":"Expenses","Расходы по категориям":"Spending by category","Всего":"Total","всех трат":"of all spending","категория":"category","категорий":"categories","В этом периоде расходов нет":"No spending in this period","цель":"goal","Правило 50/30/20":"50/30/20 rule","Обязательное":"Needs","Жильё, продукты, транспорт, здоровье, связь.":"Housing, groceries, transport, health, phone.","Выше ориентира.":"Above the target.","В норме.":"On track.","Желания":"Wants","Кафе, т const SEGRE=/(?<![\w.,])(?:\d+[ \u00a0]*)?[\u0400-\u04FF][^<>"\\]*/g;
const _tc=new Map();
const T=s=>{ if(LANG==='ru')return s; let r=_tc.get(s); if(r!==undefined)return r;
  r=s.replace(SEGRE,m=>{const t=m.trimEnd(); const v=DICT[t]; return (v!==undefined?v:t)+m.slice(t.length)}).replace(/«/g,'\u201c').replace(/»/g,'\u201d'); _tc.set(s,r); return r};
function trDom(root){ if(LANG==='ru')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const ns=[]; while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{ if(/[\u0400-\u04FF]/.test(n.nodeValue))n.nodeValue=T(n.nodeValue) });
  root.querySelectorAll('[aria-label],[title],[placeholder]').forEach(el=>['aria-label','title','placeholder'].forEach(k=>{const v=el.getAttribute(k); if(v&&/[\u0400-\u04FF]/.test(v))el.setAttribute(k,T(v))})) }
document.documentElement.lang=LANG;
if(LANG!=='ru'){ document.title=T(document.title); trDom(document.body) }

async function initDb(){

    if(!window.claude||!window.claude.use)return;

    if(!db||!user)return;

    let done=false, unsub;
    const handle=snap=>{

      const docs=snap.docs||[]; const items=[]; let settings=null, found=false;
      docs.forEach(d=>{const data=typeof d.data==='function'?d.data():d.data; if(!data)return;

/* ---------- расчёты ---------- */
function sums(m){
  const list=S.tx.filter(t=>secOf(t)===mode&&periodOfDate(t.date)===m); let inc=0,exp=0,sav=0; const byCat={}, byDay=Array(pLen(m)).fill(0), byGroup={need:0,want:0};
  list.forEach(t=>{
    if(t.t==='i')inc+=t.amt; else if(isSav(t))sav+=t.amt; else{exp+=t.amt; byCat[t.cat]=(byCat[t.cat]||0)+t.amt; byDay[Math.min(byDay.length-1,Math.max(0,dayIdx(m,t.date)))]+=t.amt; byGroup[catOf(t).g]+=t.amt}
  });
  return {list,inc,exp,sav,byCat,byDay,byGroup};
}
function insights(m,s){
  if(mode==='b')return bizInsights(m,s); if(mode==='f')return firmInsights(m,s);
  const out=[]; const isCur=m===periodOfDate(todayStr()); const day=dayIdx(m,todayStr())+1; const dim=pLen(m);
  if(!s.list.length)return [{tone:'info',title:T('Пока пусто'),text:T('Добавьте первую операцию кнопкой «+», и здесь появятся подсказки.')}];
  const b=S.budget.total;
  if(b){
    if(s.exp>b)out.push({tone:'bad',title:T('Бюджет превышен'),text:T('Потрачено на ')+money(s.exp-b)+T(' больше лимита периода.')});
    else if(s.exp/b>=.8)out.push({tone:'warn',title:T('Использовано ')+Math.round(s.exp/b*100)+T('% бюджета'),text:T('Осталось ')+money(b-s.exp)+T('. Притормозите с необязательными тратами.')});
    else out.push({tone:'good',title:T('Бюджет под контролем'),text:T('Использовано ')+Math.round(s.exp/b*100)+T('%, осталось ')+money(b-s.exp)+'.'});
  }
  if(isCur&&day>=3&&s.exp>0){
    const proj=s.exp/day*dim;
    if(b&&proj>b)out.push({tone:'warn',title:T('Прогноз выше бюджета'),text:T('В таком темпе до следующей зарплаты выйдет около ')+moneyR(proj)+T(' при лимите ')+moneyR(b)+'.'});
    else out.push({tone:'info',title:T('Прогноз расходов: ')+moneyR(proj),text:T('Считается по среднему темпу за ')+day+T(' дн. периода.')});
  }
  if(s.sav>0&&s.inc>0){const sr=s.sav/s.inc*100; out.push({tone:sr>=20?'good':'info',title:T('Отложено ')+money(s.sav),text:Math.round(sr)+T('% дохода')+(sr>=20?T('. Выше ориентира в 20%.'):T('. Ориентир: 20%.'))})}
  if(s.inc>0){
    const rate=(s.inc-s.exp)/s.inc*100;
    if(rate<0)out.push({tone:'bad',title:T('Расходы больше доходов'),text:T('Минус ')+money(s.exp-s.inc)+T(' за период. Проверьте крупные категории в аналитике.')});
    else if(s.sav>0){}
    else if(rate<10)out.push({tone:'warn',title:T('Откладываете ')+Math.round(rate)+T('% дохода'),text:T('Ориентир: 20%. Это ')+moneyR(s.inc*.2)+T(' с текущего дохода.')});
    else out.push({tone:'good',title:T('Откладываете ')+Math.round(rate)+T('% дохода'),text:rate>=20?T('Это выше ориентира в 20%. Хороший темп.'):T('До ориентира в 20% осталось немного.')});
  }
  Object.keys(S.budget.cats).forEach(id=>{const lim=S.budget.cats[id]; const sp=s.byCat[id]||0; const c=CE.find(x=>x.id===id);
    if(c&&lim>0&&sp>lim)out.push({tone:'bad',title:c.n+T(': лимит превышен'),text:T('Потрачено ')+money(sp)+T(' при лимите ')+money(lim)+'.'})});
  const prev=sums(addMonths(m,-1));
  let worst=null; Object.keys(s.byCat).forEach(id=>{const p=prev.byCat[id]||0; const d=s.byCat[id]-p; if(p>0&&d>30&&s.byCat[id]/p>1.3&&(!worst||d>worst.d))worst={id,d,p}});
  if(worst&&(!isCur||day>=10)){const c=CE.find(x=>x.id===worst.id); out.push({tone:'warn',title:c.n+T(' выросли'),text:T('На ')+money(worst.d)+T(' больше, чем в прошлом периоде.')})}
  return out.slice(0,4);
}

  if(raf)return; raf=requestAnimationFrame(()=>{raf=0; slideTick(sl)});
  clearTimeout(swT); swT=setTimeout(()=>{slideTick(sl); const idx=sl.clientWidth?Math.round(sl.scrollLeft/sl.clientWidth):0, want=MODES[Math.max(0,Math.min(2,idx))]; if(want!==mode){mode=want; curMonth=periodOfDate(todayStr()); render(true)}},140);
},true);
function slideTick(sl){
  const idx=sl.clientWidth?Math.round(sl.scrollLeft/sl.clientWidth):0;
  const pp=sl.clientWidth?sl.scrollLeft/sl.clientWidth:0; sl.style.setProperty('--p',pp.toFixed(3));
  sl.querySelectorAll('.slide').forEach((el,k)=>el.style.setProperty('--d',Math.min(1,Math.abs(k-pp)).toFixed(3)));
  document.querySelectorAll('#pager i').forEach((d,k)=>d.classList.toggle('on',k===idx));
}

function vcDate(low){const d=new Date(); if(/позавчера|day before yesterday/.test(low))d.setDate(d.getDate()-2); else if(/вчера|yesterday/.test(low))d.setDate(d.getDate()-1); return ymd(d)}
function localParse(text){
  let t=String(text).replace(/(\d)[,](\d)/g,'$1.$2').replace(/(\d+)\s*(?:евро|euros?|eur|€)\s*(\d{1,2})(?!\d)/gi,'$1.$2');
  const parts=t.split(/[;\n]|,|\s(?:потом|еще|ещё)\s|\sи\s(?=(?:потратил|оплатил|купил|заплатил|получил|заработал|отложил|пришло))|\s(?:then|also)\s|\sand\s(?=(?:spent|paid|bought|received|earned|saved|got))/i).map(x=>x.trim()).filter(Boolean);
  const out=[]; let sticky=null;
  const all=t.toLowerCase().replace(/ё/g,T('е')); const firmW=/фирм|\bсиа\b|\bsia\b|компани|\bооо\b|company|\bfirm\b|\bltd\b|\bllc\b/, bizW=/самозанят|бизнес|\bип\b|для работы|по работе|self-employed|self employed|freelance|business|sole trader|for work/, perW=/личн|домашн|для себя|personal|\bhome\b|for myself/;
  for(const part of parts){
    const low=part.toLowerCase().replace(/ё/g,T('е')); const m=low.match(/(\d+(?:\.\d+)?)/); if(!m)continue;
    const amt=Math.round(parseFloat(m[1])*100)/100; if(!(amt>0))continue;
    if(firmW.test(low))sticky='f'; else if(bizW.test(low))sticky=true; else if(perW.test(low))sticky=false;
    const inc=/получил|заработал|пришл|поступил|зарплат|доход|клиент (?:заплатил|оплатил)|(?:заплатил|оплатил)[а-я]* клиент|продал|received|earned|\bgot\b|came in|income|salary|client paid|paid by|\bsold\b/.test(low)&&!/потратил|выплатил|купил|отдал|на зарплат|spent|bought|gave|for salar/.test(low);
    let b=sticky; 
    const bizCat=!inc&&Object.keys(KWB).find(k=>BIZ_ONLY.includes(k)&&KWB[k].test(low));
    if(b===null){b=(firmW.test(all)&&!perW.test(all))?'f':(bizW.test(all)&&!perW.test(all))?true:(bizCat?true:(/клиент|client/.test(low)&&inc?true:(mode==='f'?'f':mode==='b')))}
    let cat; const t_=inc?'i':'e';
    if(inc){const K=b?KWBI:KWI; cat=Object.keys(K).find(k=>K[k].test(low))||(b?'bi3':'iother')}
    else{const K=b?KWB:KW; cat=Object.keys(K).find(k=>K[k].test(low))||(b?'be_other':'other')}
    if(b==='f'){ const FM={be_gear:'fe_gear',be_soft:'fe_soft',be_ads:'fe_ads',be_rent:'fe_rent',be_sub:'fe_sub',be_other:'fe_other',tax:'tax',bi1:'fi1',bi2:'fi2',bi3:'fi3'}; cat=FM[cat]||cat; if(!inc){if(/дивиденд|dividend/.test(low))cat='div'; else if(/зарплат|сотрудник|аванс|salar|employee|payroll/.test(low))cat='fe_pay'} }
    const nm=part.match(/(?:на|за|for|on)\s+(.+?)(?:\s+\d.*)?$/i);
    out.push({t:t_,amt,b:b===true,f:b==='f',cat,date:vcDate(low),note:nm&&!/^(?:самозанят|бизнес|личн|работ|self|business|personal|work)/i.test(nm[1])?nm[1].replace(/\s*(?:евро|euros?|eur|€)\s*$/i,'').slice(0,50):''});
  }
  return out;
}
function vcNorm(x){
  const t=x.t==='i'?'i':'e', f=!!x.f, b=!f&&!!x.b, L=listFor(t,f?'f':b); const amt=Math.round(num(x.amt)*100)/100;
  if(!(amt>0))return null;
  return {t,b,f,amt,cat:L.some(c=>c.id===x.cat)?x.cat:L[L.length-1].id,date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:todayStr(),note:String(x.note||'').slice(0,60)};
}
async function aiParse(text){
  try{
    if(!window.claude||!window.claude.use)return null;
    const sm=await window.claude.use('sample'); if(!sm||!sm.json)return null;
    const lst=(t,b)=>listFor(t,b).map(c=>c.id+' — '+c.n).join('; ');
    const prompt=(LANG==='en'?'The user dictates in English; write notes in English. ':'')+'Ты разбираешь диктовку трат и доходов для приложения учёта финансов. Верни ТОЛЬКО JSON-массив без пояснений и без markdown.\n'
     +'Элемент: {"t":"e"|"i","amt":число,"b":true|false,"f":true|false,"cat":"id категории","date":"YYYY-MM-DD","note":"коротко, 1-3 слова"}.\n'
     +'t: e расход, i доход. b: true для самозанятости/бизнеса (слова «самозанятое», «бизнес», «клиент», «для работы», оборудование для съёмок и т.п.), иначе false. Если режим назван один раз, применяй его ко всем следующим пунктам, пока не назван другой.\n'
     +'f: true для фирмы (SIA, «фирма», «компания», «ООО»); тогда b=false. Если раздел не назван, '+(mode==='f'?'f=true':'b='+(mode==='b'))+'.\n'
     +'Категории f=true расходы: '+lst('e','f')+'. Доходы: '+lst('i','f')+'.\n'
     +'Категории b=false расходы: '+lst('e',false)+'. Доходы: '+lst('i',false)+'.\nКатегории b=true расходы: '+lst('e',true)+'. Доходы: '+lst('i',true)+'.\n'
     +'Сегодня '+todayStr()+'. «вчера», «позавчера» считай от сегодня. Сумма в валюте приложения, десятичная часть через точку («6,45» → 6.45, «6 евро 45» → 6.45). Несколько трат в одной фразе — несколько элементов. Если сумма не названа, пропусти пункт.\nТекст: +text+';
    const r=await sm.json(prompt,{modelTier:'quick',cache:false});
    return Array.isArray(r)?r:(r&&Array.isArray(r.items)?r.items:null);
  }catch(e){return null}
}

function quickBar(msg){

function quickClose(){const b=$('#vbar'); if(b)b.classList.remove('on'); const q=$('#vq'); if(q)q.blur()}
function quickGo(){const q=$('#vq'); const t=q?q.value.trim():''; quickClose(); if(!t)return; vc.base=t; vLive=true; voiceFinish()}
function armIdle(ms){clearTimeout(vIdle); vIdle=setTimeout(()=>voiceFinish(),ms||2200)}
function voiceStart(){
  if(vLive){voiceFinish();return}
  vc.base=''; vc.items=null;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fail=()=>{vLive=false; clearTimeout(vIdle); vPill(false); vc.noMic=true; quickBar()};
  if(vc.noMic||(document.featurePolicy&&!document.featurePolicy.allowsFeature('microphone'))){quickBar(); return}
  if(vc.dict){ vLive=true; vPill(true,T('Слушаю…')); armIdle(7000); try{vc.dict.start().catch(fail)}catch(e){fail()} return }
  if(SR){
    try{
      const r=new SR(); r.lang=LANG==='ru'?'ru-RU':'en-US'; r.continuous=true; r.interimResults=true;
      r.onresult=ev=>{let fin='',it=''; for(let i=0;i<ev.results.length;i++){const t=ev.results[i][0].transcript; if(ev.results[i].isFinal)fin+=t+' '; else it+=t} vc.base=(fin+it).trim(); vPill(true,vc.base||T('Слушаю…')); armIdle()};
      r.onerror=ev=>{ if(!vLive)return; vLive=false; clearTimeout(vIdle); vPill(false);
        if(/not-allowed|service-not-allowed|audio-capture/.test(ev.error)){vc.noMic=true; quickBar()}
        else if(ev.error==='no-speech'||ev.error==='aborted')vToast(T('Ничего не слышно, нажмите ещё раз')); else vToast(T('Не удалось распознать речь')) };
      r.onend=()=>{ if(vLive)voiceFinish() };
      vSR=r; vLive=true; vPill(true,T('Слушаю…')); armIdle(7000); r.start(); return;
    }catch(e){fail(); return}
  }
  quickBar();
}
async function voiceFinish(){
  if(!vLive)return; vLive=false; clearTimeout(vIdle);
  try{vSR&&vSR.stop()}catch(e){}
  try{if(vc.dict&&vc.on)await vc.dict.stop()}catch(e){}
  const text=(vc.base||'').trim();
  if(!text){vPill(false); vToast(T('Ничего не услышал')); return}
  vPill(true,T('Записываю…'));
  let raw=await aiParse(text); if(!raw||!raw.length)raw=localParse(text);
  const items=(raw||[]).map(vcNorm).filter(Boolean); vPill(false);
  if(!items.length){vToast(T('Не нашёл сумму: «')+text.slice(0,50)+'»'); return}
  const ids=vcCommit(items);
  vToast(T('Записано: ')+items.map(x=>(x.t==='i'?'+':'−')+money(x.amt)+' '+catOf({t:x.t,cat:x.cat,b:x.b,f:x.f}).n).join(', '),ids);
}

  if(!items.length){paintVoice(); const e=$('#fe'); if(e)e.textContent=T('Не нашёл суммы. Назовите сумму и на что: «6,45 на оборудование».'); $('#vt').value=vc.base; return}

const mLeft=ym=>{const [y,m]=ym.split('-').map(Number), n=new Date(); return (y-n.getFullYear())*12+(m-1-n.getMonth())};
const mFmt=ym=>{const [y,m]=ym.split('-'); return [T('янв'),T('фев'),T('мар'),T('апр'),T('мая'),T('июн'),T('июл'),T('авг'),T('сен'),T('окт'),T('ноя'),T('дек')][+m-1]+' '+y};
function goalRow(g){
  const left=Math.max(0,g.target-g.saved), p=g.target?g.saved/g.target*100:0, done=left<=0;
  let sub='';
  if(done)sub=T('<small class="gdone">Цель достигнута</small>');
  else{
    sub=T('<small>Осталось ')+moneyR(left)+'</small>';
    if(g.date){const k=mLeft(g.date); sub=k<0?T('<small class="late">Срок прошёл · осталось ')+moneyR(left)+'</small>':T('<small>Осталось ')+moneyR(left)+T(' · до ')+mFmt(g.date)+(k>0?T(' · откладывать ≈ ')+moneyR(left/k)+T('/мес'):'')+'</small>'}
  }
  return '<div class="gr"><div class="l"><span class="n">'+esc(g.name)+'</span><span class="v">'+moneyR(g.saved)+T(' <small>из ')+moneyR(g.target)+'</small></span></div>'+bar(p,done?'var(--good)':'var(--bar)')
   +'<div class="gf">'+sub+'<span class="gb"><button class="paybtn" data-act="fund" data-id="'+esc(g.id)+T('">Пополнить</button><button class="paybtn" data-act="editgoal" data-id="')+esc(g.id)+T('" aria-label="Изменить цель">⋯</button></span></div></div>');
}
function goalsCard(){
  return T('<section class="card g"><div class="hd"><h3>Цели накоплений</h3><button class="link" data-act="addgoal">Добавить</button></div>')
   +(S.goals.length?'<div>'+S.goals.map(goalRow).join('')+'</div>':T('<p class="mut">Накопите на то, что хочется: отпуск, техника, подушка безопасности. Задайте сумму и срок, а приложение подскажет, сколько откладывать в месяц.</p>'))+'</section>';
}
function openGoal(id){
  const g=id?S.goals.find(x=>x.id===id):null; editId=id||null;
  sheet('<h2>'+(g?T('Изменить цель'):T('Новая цель'))+T('</h2><label class="f">Название<input id="gn" class="inp" type="text" maxlength="40" placeholder="Например: отпуск" value="')+esc(g?g.name:'')+'"></label>'
   +T('<label class="f">Нужная сумма<input id="gt" class="inp" inputmode="decimal" placeholder="0" value="')+(g?String(g.target).replace('.',DEC):'')+'"></label>'
   +T('<label class="f">К какому месяцу (необязательно)<input id="gd" class="inp" type="month" value="')+(g&&g.date?g.date:'')+'"></label>'
   +'<div class="err" id="ge"></div><div class="btns">'+(g?'<button class="btn ghost" data-act="delgoal" data-id="'+esc(g.id)+T('" style="flex:none;color:var(--bad)">Удалить</button>'):T('<button class="btn ghost" data-act="close">Отмена</button>'))+T('<button class="btn" id="gok">Сохранить</button></div>'));
  $('#gok').onclick=()=>{const n=$('#gn').value.trim(), t=num($('#gt').value), d=$('#gd').value;
    if(!n||!(t>0)){$('#ge').textContent=T('Укажите название и сумму больше нуля');return}
    if(g){g.name=n;g.target=t; if(d)g.date=d; else delete g.date; delete g.demo} else {const o={id:uid(),name:n,target:t,saved:0}; if(d)o.date=d; S.goals.push(o)}
    touch(); closeModal(); render()};
}
function fundGoal(id){
  const g=S.goals.find(x=>x.id===id); if(!g)return;
  askNum(T('Пополнить: ')+g.name,'',T('Сколько вы откладываете сейчас. Сумма запишется в «Сбережения».'),x=>{
    if(!(x>0))return; g.saved=Math.round((g.saved+x)*100)/100; delete g.demo;
    const d=todayStr(); S.tx.push({id:uid(),t:'e',cat:'savings',amt:x,date:d,note:T('Цель: ')+g.name,gid:g.id}); touch(mk(d)); touch(); render()});
}

let pieSel=null;
function pieChart(s,cats){
  const R=76, C=2*Math.PI*R, tot=s.exp; let off=0, arcs='';

  cats.forEach(id=>{const c=ALLE.find(x=>x.id===id)||{n:id,c:'#868e96'}, v=s.byCat[id], len=v/tot*C, gap=cats.length>1?Math.min(3,len*.3):0;
    arcs+='<circle class="pa'+(sel===id?' on':sel?' dim':'')+'" data-act="pie" data-id="'+id+'" cx="100" cy="100" r="'+R+'" fill="none" stroke="'+c.c+'" stroke-width="'+(sel===id?34:28)+'" stroke-dasharray="'+Math.max(0,len-gap).toFixed(2)+' '+(C-Math.max(0,len-gap)).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 100 100)"/>';
    off+=len});
  const cc=sel?(ALLE.find(x=>x.id===sel)||{n:sel}):null, sv=sel?s.byCat[sel]:tot;
  return T('<div class="pie"><svg viewBox="0 0 200 200" role="img" aria-label="Расходы по категориям">')+arcs+'</svg><div class="pc" data-act="pie" data-id="">'+(sel?'<span class="pn">'+esc(cc.n)+'</span>':T('<span class="pn">Всего</span>'))+'<b>'+money(sv)+'</b>'+(sel?'<span class="pp">'+(sv/tot*100).toFixed(sv/tot<.1?1:0).replace('.',DEC)+T('% всех трат</span>'):'<span class="pp">'+cats.length+' '+(cats.length===1?T('категория'):cats.length<5?T('категории'):T('категорий'))+'</span>')+'</div></div>';
}

  if(p>=LV.minBase){const base=Math.min(Math.max(S.biz.vsaoiBase||LV.minBase,LV.minBase),p); const full=base*LV.full, pens=(p-base)*LV.pens; return {base,full,pens,tot:full+pens,p}}
  return {base:0,full:0,pens:p*LV.pens,tot:p*LV.pens,p};
};
const iinCum=(profitCum,vsaoiCum,n)=>{const t=Math.max(0,profitCum-vsaoiCum-(S.biz.minUsed?0:LV.ntm*n)); return t<=LV.iinLim?t*LV.iin:LV.iinLim*LV.iin+(t-LV.iinLim)*LV.iinHi};
function bizMonth(key){const x=sums(key); const paid=x.byCat.tax||0; const opex=x.exp-paid; return {inc:x.inc,opex,profit:x.inc-opex,paid}}
function taxModel(m,reg){
  reg=reg||curReg();
  if(S.country!=='LV'&&reg!=='custom')return taxModelG(m,reg);
  const yr=m.slice(0,4), rows=[]; let cp=0,cv=0,cinc=0,cpaid=0,prev=0,n=0,due=0;
  for(let k=1;k<=12;k++){
    const key=yr+'-'+pad(k); if(key>m)break; n++;
    const b=bizMonth(key); cinc+=b.inc; cp+=b.profit; cpaid+=b.paid;
    let vs=0,ii=0,d=0;
    if(reg==='lv'){vs=lvVsaoi(b.profit).tot; cv+=vs; const cum=iinCum(cp,cv,n); ii=Math.max(0,cum-prev); prev=cum; d=vs+ii}
    else if(reg==='mun')d=b.inc*LV.mun;
    else{const base=S.biz.base==='profit'?Math.max(0,b.profit):b.inc; d=base*S.biz.rate/100}
    due+=d; rows.push({key,inc:b.inc,opex:b.opex,profit:b.profit,paid:b.paid,vs,ii,due:d});
  }
  return {rows,cur:rows[rows.length-1],ytd:{inc:cinc,profit:cp,paid:cpaid,due:reg==='lv'?cv+prev:due,vs:cv,iin:prev}};
}
const regName=()=>{const R=curReg(); if(R==='custom')return T('ставка ')+S.biz.rate+'%'; if(S.country!=='LV')return CC().se.regs.find(r=>r.id===R).name; return {lv:'IIN + VSAOI',mun:'MUN 25%'}[R]};

const FIRM_VAT_CATS=['fe_rent','fe_soft','fe_ads','fe_sub','fe_gear','fe_other'];
function firmMonth(key){
  return withMode('f',()=>{
    const x=sums(key), by=x.byCat, pay=by.fe_pay||0, tax=by.tax||0, div=by.div||0, opex=x.exp-pay-tax-div;
    return {inc:x.inc,pay,tax,div,opex,profit:x.inc-opex-pay-tax};
  });
}
function firmYear(m){
  const yr=m.slice(0,4), t={inc:0,pay:0,tax:0,div:0,opex:0,profit:0,vatOpex:0};
  for(let k=1;k<=12;k++){const key=yr+'-'+pad(k); if(key>m)break; const r=firmMonth(key); for(const q in r)t[q]=(t[q]||0)+r[q];
    t.vatOpex+=withMode('f',()=>{const b=sums(key).byCat; return FIRM_VAT_CATS.reduce((a,c)=>a+(b[c]||0),0)})}
  return t;
}
function firmVatIn(m){const v=FP().vat||0; return withMode('f',()=>{const b=sums(m).byCat; return FIRM_VAT_CATS.reduce((a,c)=>a+(b[c]||0),0)*v/(1+v)})}
function firmCalc(m){
  const P=FP(), c=firmMonth(m), Y=firmYear(m), n=S.firm.staff||0, vr=P.vat||0;
  const erc=clamp0(c.pay-(P.erFree||0)*n)*P.er, eec=clamp0(c.pay-(P.eeFree||0)*n)*P.ee;
  const iin=clamp0(c.pay-eec-P.ntm*n)*P.pit;
  const on=S.firm.vat&&vr>0, vatOut=on?c.inc*vr/(1+vr):0, vatIn=on?firmVatIn(m):0, vat=clamp0(vatOut-vatIn);
  const cit=P.citF?P.citF(Y):P.cit;
  let free,std,alt=null;
  if(P.mode==='dist'){
    free=clamp0(Y.profit-Y.div*(1+cit/(1-cit)));
    std={cit:free*cit,net:free*(1-cit)*(1-(P.divTax||0))};
    if(P.alt)alt={cit:free*P.alt.cit,net:free*(1-P.alt.cit)*(1-P.alt.pit)};
  }else{
    const citY=clamp0(Y.profit)*cit; free=clamp0(Y.profit-citY-Y.div);
    std={cit:citY,net:free*(1-(P.divTax||0))};
  }
  return {c,Y,erc,eec,iin,vatOut,vatIn,vat,free,cit,std,alt,P};
}

}

function taxModelG(m,reg){
  const cc=CC(), rg=cc.se.regs.find(r=>r.id===reg)||cc.se.regs[0], P=regPar(rg), yr=m.slice(0,4), rows=[];
  let cp=0,cinc=0,cpaid=0,cop=0,n=0,prev=0,prevS=0,prevI=0;
  for(let k=1;k<=12;k++){
    const key=yr+'-'+pad(k); if(key>m)break; n++;
    const b=bizMonth(key); cinc+=b.inc; cp+=b.profit; cpaid+=b.paid; cop+=b.opex;
    const r=cc.se.calc(rg.id,{inc:cinc,opex:cop,profit:cp,n},P), tot=r.soc+r.inc;
    rows.push({key,inc:b.inc,opex:b.opex,profit:b.profit,paid:b.paid,vs:clamp0(r.soc-prevS),ii:clamp0(r.inc-prevI),due:clamp0(tot-prev)});
    prev=tot; prevS=r.soc; prevI=r.inc;
  }
  return {rows,cur:rows[rows.length-1],ytd:{inc:cinc,profit:cp,paid:cpaid,due:prev,vs:prevS,iin:prevI}};
}

    case 'pie': pieSel=(id&&pieSel!==id)?id:null; render(); break;
    case 'paywall': openPaywall(v); break;
    case 'sprev': case 'snext': {const i=Math.max(0,Math.min(2,MODES.indexOf(mode)+(a==='snext'?1:-1))); const sl=$('#slides'); if(sl)sl.scrollTo({left:i*sl.clientWidth,behavior:'smooth'}); break}
    case 'unlock': S.plan[v]=true; touch(); closeModal(); mode=v; render(); vToast(v==='f'?T('Фирма и всё приложение включены (тест)'):T('Раздел «')+PLANS[v].name+T('» включён (тест)')); break;
    case 'fvat': S.firm.vat=v==='1'; touch(); render(); break;
    case 'fstaff': askNum(T('Сколько сотрудников'),String(S.firm.staff||''),T('Для оценки подоходного налога с зарплат. Владельца считайте, если он получает зарплату.'),val=>{S.firm.staff=Math.max(0,Math.round(val)); touch(); render()}); break;
    case 'tab': view=v; render(); $('#main').scrollTop=0; break;
    case 'prevm': curMonth=addMonths(curMonth,-1); render(); break;
    case 'nextm': curMonth=addMonths(curMonth,1); render(); break;
    case 'hf': hf=v; render(); break;
    case 'add': openTx(); break;
    case 'addfixed': openFixed(); break;
    case 'news': view=view==='news'?'home':'news'; render(); window.scrollTo(0,0); {const m_=$('#main'); if(m_)m_.scrollTop=0} break;
    case 'nf': newsF=v; render(); break;
    case 'voice': voiceStart(); break;
    case 'vstop': voiceFinish(); break;
    case 'vqgo': quickGo(); break;
    case 'vqx': quickClose(); break;
    case 'vundo': voiceUndo(); break;
    case 'vmic': if(vc.dict){ if(vc.on){vcStop().then(()=>{if(vc.base.trim())vcParse()})} else {try{vc.dict.start().catch(()=>{})}catch(e){}} } break;
    case 'vgo': vcStop().then(vcParse); break;
    case 'vback': vc.items=null; paintVoice(); break;
    case 'vsave': vcSave(); break;
    case 'vdel': vc.items.splice(+id,1); if(!vc.items.length){vc.items=null} paintVoice(); break;
    case 'addi': openTx(); draft.t='i'; draft.cat=listFor('i',draft.b)[0].id; paintTx(); break;
    case 'adds': openTx(); draft.cat='savings'; paintTx(); break;
    case 'editfixed': openFixed(id); break;
    case 'fcat': draft.cat=id; paintFx(); break;
    case 'savefixed': saveFixed(); break;
    case 'delfixed': S.fixed=S.fixed.filter(x=>x.id!==editId); touch(); closeModal(); render(); break;
    case 'payfixed': payFixed(id); break;
    case 'unpayfixed': unpayFixed(id); break;
    case 'edit': openTx(id); break;
    case 'close': closeModal(); break;
    case 'type': draft.t=v; draft.cat=listFor(v,draft.b)[0].id; paintTx(); break;
    case 'pickcat': draft.cat=id; paintTx(); break;
    case 'savetx': saveTx(); break;
    case 'deltx': { const o=S.tx.find(x=>x.id===editId); if(o){S.tx=S.tx.filter(x=>x.id!==editId); if(o.gid){const g=S.goals.find(x=>x.id===o.gid); if(g){g.saved=Math.max(0,Math.round((g.saved-o.amt)*100)/100); touch()}} touch(mk(o.date))} closeModal(); render(); break; }
    case 'setpay': askNum(T('День зарплаты'),S.payday,T('Число месяца, когда приходят деньги. Период считается от этого дня до следующей зарплаты.'),x=>{S.payday=Math.min(31,Math.max(1,Math.round(x)||1)); touch(); curMonth=periodOfDate(todayStr()); render()}); break;
    case 'cleartbl': {
      const sec=x=>secOf(x)===mode, pick=x=>v==='s'?isSav(x):v==='e'?(x.t==='e'&&!isSav(x)):x.t==='i', a=S.tx.filter(x=>pick(x)&&sec(x)&&periodOfDate(x.date)===curMonth), all=S.tx.filter(x=>pick(x)&&sec(x));
      const nm=v==='i'?T('доходы'):v==='s'?T('сбережения'):T('расходы');
      if(!all.length){sheet(T('<h2>Очистить ')+nm+T('</h2><p class="mut">Здесь нечего очищать.</p><div class="btns"><button class="btn ghost" data-act="close">Закрыть</button></div>'));break}
      sheet(T('<h2>Очистить ')+nm+T('</h2><p class="mut">Раздел «')+({p:T('Личные'),b:T('Самозанятый'),f:T('Фирма')}[mode])+T('». Удалённые записи не вернуть.</p><div class="btns" style="flex-direction:column"><button class="btn ghost" id="cp"')+(a.length?'':' disabled style="opacity:.4"')+T('>Только за этот период (')+a.length+T(')</button><button class="btn danger" id="ca">За всё время (')+all.length+T(')</button><button class="btn ghost" data-act="close">Отмена</button></div>'));
      const run=list=>{const ids=new Set(list.map(x=>x.id)); const ms=new Set(list.map(x=>mk(x.date))); S.tx=S.tx.filter(x=>!ids.has(x.id)); ms.forEach(touch); closeModal(); render()};
      $('#cp').onclick=()=>{if(a.length)run(a)}; $('#ca').onclick=()=>run(all); break; }
    case 'clearsec': askConfirm(T('Стереть раздел «')+({p:T('Личные'),b:T('Самозанятый'),f:T('Фирма')}[mode])+'»?',T('Все доходы и расходы этого раздела будут удалены. Второй раздел и настройки не изменятся.'),T('Стереть'),()=>{
      const rm=S.tx.filter(x=>secOf(x)===mode); const ms=new Set(rm.map(x=>mk(x.date))); S.tx=S.tx.filter(x=>secOf(x)!==mode); S.fixed=S.fixed.filter(f=>secOf(f)!==mode); touch(); ms.forEach(touch); render()}); break;
    case 'mode': {const sl=$('#slides'); if(sl&&view==='home'){sl.scrollTo({left:MODES.indexOf(v)*sl.clientWidth,behavior:'smooth'}); break}} mode=v; curMonth=periodOfDate(todayStr()); if(mode==='b')ensureBizDemo(); if(mode==='f')ensureFirmDemo(); render(); $('#main').scrollTop=0; break;
    case 'minuse': S.biz.minUsed=v==='1'; touch(); render(); break;
    case 'regime': S.biz.regime=v; touch(); render(); break;
    case 'setvbase': askNum(T('База соцвзносов, € в месяц'),S.biz.vsaoiBase||780,T('Не меньше 780 €. Чем выше база, тем больше взносы и будущая пенсия.'),x=>{S.biz.vsaoiBase=Math.max(780,x); touch(); render()}); break;
    case 'setrate': askNum(T('Ставка налога, %'),S.biz.rate,T('Какую долю вы откладываете на налоги.'),x=>{S.biz.rate=Math.min(100,x); touch(); render()}); break;
    case 'base': S.biz.base=v; touch(); render(); break;
    case 'settotal': askNum(T('Бюджет на период'),S.budget.total||'',T('Общий лимит расходов. Ноль убирает бюджет.'),x=>{S.budget.total=x; touch(); render()});
      if(S.budget.total){const rb=document.createElement('button'); rb.className='btn ghost'; rb.style.color='var(--bad)'; rb.textContent=T('Убрать бюджет'); rb.onclick=()=>{closeModal(); S.budget.total=0; touch(); render()}; $('#sheet .btns').prepend(rb)} break;
    case 'setcat': { const c=CE.find(x=>x.id===id); askNum(T('Лимит: ')+c.n,S.budget.cats[id]||'',T('Сколько за период вы готовы тратить на эту категорию. Ноль убирает лимит.'),x=>{if(x>0)S.budget.cats[id]=x; else delete S.budget.cats[id]; touch(); render()});
      if(S.budget.cats[id]){const rb=document.createElement('button'); rb.className='btn ghost'; rb.style.color='var(--bad)'; rb.textContent=T('Убрать лимит'); rb.onclick=()=>{closeModal(); delete S.budget.cats[id]; touch(); render()}; $('#sheet .btns').prepend(rb)} break; }
    case 'addgoal': openGoal(); break;
    case 'editgoal': openGoal(id); break;
    case 'fund': fundGoal(id); break;
    case 'delgoal': { const g=S.goals.find(x=>x.id===id); askConfirm(T('Удалить цель?'),'«'+g.name+T('» исчезнет. Записи в «Сбережениях» останутся.'),T('Удалить'),()=>{S.goals=S.goals.filter(x=>x.id!==id); touch(); render()}); break; }
    case 'settings': openSettings(); break;
    case 'country': openCountry(false); break;
    case 'lang': setLang(v); break;
    case 'setcountry': pickCountry(v); break;
    case 'setparam': { const rg=CC().se.regs.find(r=>r.param&&r.param.k===v); if(rg)askNum(rg.param.label,S.biz[v]!=null?S.biz[v]:rg.param.def,rg.param.hint,x=>{S.biz[v]=Math.min(100,x); touch(); render()}); break; }
    case 'cur': S.cur=v; touch(); openSettings(); render(); break;
    case 'csv': { const t=csv(); sheet(T('<h2>Экспорт в CSV</h2><p class="mut">Скопируйте текст и вставьте в таблицу или заметки.</p><textarea id="ct" class="inp" readonly></textarea><div class="btns"><button class="btn ghost" data-act="close">Закрыть</button><button class="btn" id="cc">Скопировать</button></div>')); $('#ct').value=t;
      $('#cc').onclick=async()=>{try{await navigator.clipboard.writeText(t);$('#cc').textContent=T('Скопировано')}catch(e){$('#ct').select();$('#cc').textContent=T('Выделено, скопируйте вручную')}}; break; }
    case 'clrdemo': askConfirm(T('Удалить примеры?'),T('Примерные операции, бюджет и цели исчезнут. Ваши собственные записи останутся.'),T('Удалить'),()=>{
      const ms=new Set(S.tx.filter(t=>t.demo).map(t=>mk(t.date))); S.tx=S.tx.filter(t=>!t.demo); S.goals=S.goals.filter(g=>!g.demo); S.fixed=S.fixed.filter(f=>!f.demo);
      if(S.demo){S.budget={total:0,cats:{}}} S.demo=false; ms.forEach(m=>touch(m)); touch(); render()}); break;
    case 'reset': askConfirm(T('Стереть все данные?'),T('Операции, бюджеты и цели будут удалены без возможности вернуть.'),T('Стереть всё'),()=>{
      const ms=new Set(S.tx.map(t=>mk(t.date))); S.tx=[]; S.goals=[]; S.fixed=[]; S.budget={total:0,cats:{}}; S.demo=false; ms.forEach(m=>touch(m)); touch(); render()}); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

let askedC=false;
function maybeAskCountry(){ if(S.cset||askedC)return; askedC=true; setTimeout(()=>{ if(!S.cset&&$('#modal').hidden)openCountry(true) },250) }
load(); curMonth=periodOfDate(todayStr()); render(); initDb().finally(()=>setTimeout(()=>{ if(!COL)maybeAskCountry() },1500));
</script>
</body>
</html>
